<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лаба 4: View Page - Каталог фільмів</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎬 Каталог фільмів</h1>
    
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Пошук за назвою...">
      </div>
      
      <div class="sort-box">
        <label>Сортувати за:</label>
        <select id="sortSelect">
          <option value="">Без сортування</option>
          <option value="name">Назва</option>
          <option value="year">Рік</option>
          <option value="rating">Рейтинг</option>
          <option value="duration">Тривалість</option>
        </select>
        <select id="sortOrder">
          <option value="asc">Зростання</option>
          <option value="desc">Спадання</option>
        </select>
      </div>
      
      <a href="create.html" class="btn btn-primary">➕ Додати фільм</a>
    </div>

    <div class="stats">
      <div class="stat-card">
        <h3>Загальна тривалість</h3>
        <p id="totalDuration">0</p>
        <span>хвилин</span>
      </div>
      <div class="stat-card">
        <h3>Середній рейтинг</h3>
        <p id="avgRating">0</p>
        <span>з 10</span>
      </div>
      <div class="stat-card">
        <h3>Кількість фільмів</h3>
        <p id="totalFilms">0</p>
        <span>штук</span>
      </div>
    </div>

    <div id="filmsContainer" class="films-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
